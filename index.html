<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen QR Code Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .video-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #screenVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        #scanCanvas {
            display: none;
        }

        .placeholder {
            text-align: center;
            color: #666;
        }

        .placeholder svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button svg {
            width: 20px;
            height: 20px;
        }

        #startBtn {
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            color: #1a1a2e;
        }

        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.3);
        }

        #stopBtn {
            background: #ff4757;
            color: #fff;
            display: none;
        }

        #stopBtn:hover {
            background: #ff3344;
        }

        #clearBtn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #clearBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
        }

        .status.scanning {
            color: #00ff88;
        }

        .status.idle {
            color: #888;
        }

        .qr-list-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .qr-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .qr-list-header h2 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .count-badge {
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .qr-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .qr-list::-webkit-scrollbar {
            width: 6px;
        }

        .qr-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .qr-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .qr-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .qr-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .qr-item-number {
            font-size: 0.8rem;
            color: #00d9ff;
            font-weight: 600;
        }

        .qr-item-time {
            font-size: 0.75rem;
            color: #666;
        }

        .qr-item-content {
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #ddd;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 6px;
            max-height: 100px;
            overflow-y: auto;
        }

        .qr-item-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        .qr-item-actions button {
            padding: 6px 12px;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .qr-item-actions button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .qr-item-actions button.copy-btn.copied {
            background: #00ff88;
            color: #1a1a2e;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #00ff88;
            color: #1a1a2e;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Screen QR Scanner</h1>
            <p class="subtitle">Share your screen and detect QR codes in real-time</p>
        </header>

        <div class="main-content">
            <div class="video-section">
                <div class="video-container">
                    <video id="screenVideo" autoplay playsinline></video>
                    <canvas id="scanCanvas"></canvas>
                    <div class="placeholder" id="placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                            <line x1="8" y1="21" x2="16" y2="21"/>
                            <line x1="12" y1="17" x2="12" y2="21"/>
                        </svg>
                        <p>Click "Start Scanning" to share your screen</p>
                    </div>
                </div>
                <div class="controls">
                    <button id="startBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        Start Scanning
                    </button>
                    <button id="stopBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="6" y="6" width="12" height="12"/>
                        </svg>
                        Stop
                    </button>
                    <button id="clearBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        Clear List
                    </button>
                </div>
                <div class="status idle" id="status">Ready to scan</div>
            </div>

            <div class="qr-list-section">
                <div class="qr-list-header">
                    <h2>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                        </svg>
                        Detected QR Codes
                    </h2>
                    <span class="count-badge" id="countBadge">0</span>
                </div>
                <div class="qr-list" id="qrList">
                    <div class="empty-state" id="emptyState">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                        </svg>
                        <p>No QR codes detected yet</p>
                        <p style="font-size: 0.85rem; margin-top: 5px;">Start scanning to detect QR codes on your screen</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">QR Code detected!</div>

    <!-- jsQR library for QR code detection -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <script>
        const video = document.getElementById('screenVideo');
        const canvas = document.getElementById('scanCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const placeholder = document.getElementById('placeholder');
        const status = document.getElementById('status');
        const qrList = document.getElementById('qrList');
        const countBadge = document.getElementById('countBadge');
        const emptyState = document.getElementById('emptyState');
        const toast = document.getElementById('toast');

        let stream = null;
        let scanning = false;
        let detectedCodes = new Set();
        let qrItems = [];
        let scanInterval = null;

        startBtn.addEventListener('click', startScanning);
        stopBtn.addEventListener('click', stopScanning);
        clearBtn.addEventListener('click', clearList);

        async function startScanning() {
            try {
                stream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        cursor: 'always'
                    },
                    audio: false
                });

                video.srcObject = stream;
                video.style.display = 'block';
                placeholder.style.display = 'none';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'flex';
                status.textContent = 'Scanning for QR codes...';
                status.className = 'status scanning';
                scanning = true;

                // Handle stream ending (user clicks "Stop sharing" in browser)
                stream.getVideoTracks()[0].onended = () => {
                    stopScanning();
                };

                // Wait for video to be ready
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    scanInterval = setInterval(scanForQRCodes, 200);
                };

            } catch (err) {
                console.error('Error starting screen share:', err);
                status.textContent = 'Failed to start screen sharing';
                status.className = 'status idle';
            }
        }

        function stopScanning() {
            scanning = false;

            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            video.srcObject = null;
            video.style.display = 'none';
            placeholder.style.display = 'block';
            startBtn.style.display = 'flex';
            stopBtn.style.display = 'none';
            status.textContent = 'Scanning stopped';
            status.className = 'status idle';
        }

        function scanForQRCodes() {
            if (!scanning || video.readyState !== video.HAVE_ENOUGH_DATA) {
                return;
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: 'dontInvert'
            });

            if (code && code.data && !detectedCodes.has(code.data)) {
                detectedCodes.add(code.data);
                addQRCodeToList(code.data);
                showToast('QR Code detected!');
            }
        }

        function addQRCodeToList(data) {
            const item = {
                id: Date.now(),
                data: data,
                time: new Date().toLocaleTimeString()
            };
            qrItems.unshift(item);

            emptyState.style.display = 'none';
            countBadge.textContent = qrItems.length;

            const itemElement = document.createElement('div');
            itemElement.className = 'qr-item';
            itemElement.innerHTML = `
                <div class="qr-item-header">
                    <span class="qr-item-number">#${qrItems.length}</span>
                    <span class="qr-item-time">${item.time}</span>
                </div>
                <div class="qr-item-content">${escapeHtml(data)}</div>
                <div class="qr-item-actions">
                    <button class="copy-btn" onclick="copyToClipboard('${escapeForAttribute(data)}', this)">
                        Copy
                    </button>
                    ${isValidUrl(data) ? `<button onclick="window.open('${escapeForAttribute(data)}', '_blank')">Open Link</button>` : ''}
                </div>
            `;

            qrList.insertBefore(itemElement, qrList.firstChild);
        }

        function clearList() {
            qrItems = [];
            detectedCodes.clear();
            qrList.innerHTML = '';
            emptyState.style.display = 'block';
            qrList.appendChild(emptyState);
            countBadge.textContent = '0';
        }

        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                button.textContent = 'Copied!';
                button.classList.add('copied');
                setTimeout(() => {
                    button.textContent = 'Copy';
                    button.classList.remove('copied');
                }, 2000);
            });
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeForAttribute(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }
    </script>
</body>
</html>
